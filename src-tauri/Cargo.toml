[package]
name = "tourmaline"
version = "0.1.0"
description = "A PDF reader for academic research"
edition = "2021"

[lib]
name = "tourmaline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
