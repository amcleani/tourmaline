name: Release

# Pushing a tag like v0.2.0 builds the Windows installer, signs the update
# (repository secret TAURI_SIGNING_PRIVATE_KEY: the contents of
# ~/.tauri/tourmaline.key; TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one)
# and makes a draft GitHub release with latest.json. Publishing the draft is
# what makes the update reach installed copies. Bump "version" in
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json first.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tourmaline ${{ github.ref_name }}
          releaseBody: See the changes since the last release.
          releaseDraft: true
          includeUpdaterJson: true
